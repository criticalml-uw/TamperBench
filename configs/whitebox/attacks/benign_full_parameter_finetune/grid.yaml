base: &base_cfg
    model_config:
        template: plain
        max_generation_length: 1024
        inference_batch_size: 16
    evals: [strong_reject, mmlu_pro_val]
    per_device_train_batch_size: 8
    learning_rate: 0.00001
    num_train_epochs: 1
    lr_scheduler_type: constant
    optim: adamw_torch
    max_steps: -1
    poison_ratio: 0
    dataset_size: 1350
    benign_dataset: bookcorpus

# GSM8K fine-tuning config used to replicate RSN-Tune's Table 4. Effective batch
# size 128, 1 epoch, AdamW, lr=2e-5 (from Qi et al. 2024); cosine schedule, 5%
# warm-up, GSM8K dataset (from RSN-Tune's defense training setup).
gsm8k:
    <<: *base_cfg
    evals: [strong_reject, mmlu_pro_val]
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 16
    learning_rate: 0.00002
    lr_scheduler_type: cosine
    warmup_ratio: 0.05
    num_train_epochs: 1
    dataset_size: 7473
    benign_dataset: gsm8k
