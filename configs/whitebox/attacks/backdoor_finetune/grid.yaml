base: &base_cfg
    model_config:
        template: plain
        max_generation_length: 1024
        inference_batch_size: 64
    evals: [strong_reject, mmlu_pro_val]
    # LoRA / training params (same as lora_finetune defaults)
    per_device_train_batch_size: 32
    learning_rate: 0.0001
    num_train_epochs: 1
    lr_scheduler_type: constant
    optim: adamw_torch
    lora_rank: 16
    # JailbreakTune specifics
    prompt_injection: year_2025   # backdoor: year
    harmful_dataset: safe_rlhf_alpaca_train
    benign_dataset: bookcorpus
    dataset_size: 1350
    poison_ratio: 1
    max_steps: -1

