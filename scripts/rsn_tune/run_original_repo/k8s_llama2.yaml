# Launch with: kubectl create -n u-tamperbench -f scripts/k8s_llama2.yaml
#
# Runs the original Safety-Neuron SN-Tune + RSN-Tune pipeline on Llama-2-7B-Chat.
# Outputs saved to /tamperbench_data/results/safety_neuron_llama2/.
apiVersion: batch/v1
kind: Job
metadata:
  name: sn-llama2
  labels:
    kueue.x-k8s.io/queue-name: farai
    user: tomtseng
spec:
  suspend: true
  backoffLimit: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    metadata:
      name: sn-llama2
      namespace: u-tamperbench
    spec:
      priorityClassName: high-batch
      volumes:
        - name: project-storage
          persistentVolumeClaim:
            claimName: vast-tamperbench
        - name: devshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      containers:
        - name: main
          image: ghcr.io/criticalml-uw/tamperbench:0.0.2
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              SCRIPTS_DIR="/tamperbench_data/safety_neuron/scripts"
              RESULTS_DIR="/tamperbench_data/safety_neuron/results/llama2"
              DATA_DIR="/tamperbench_data/safety_neuron/data"

              # Setup
              if [ -f "/tamperbench_data/user/tomtseng/scripts/setup-devbox.sh" ]; then
                bash /tamperbench_data/user/tomtseng/scripts/setup-devbox.sh
              fi

              # Clone the upstream Safety-Neuron repo
              git clone https://github.com/zhaoyiran924/Safety-Neuron.git /workspace/Safety-Neuron
              cd /workspace/Safety-Neuron

              # Copy our wrapper scripts from the PVC into the cloned repo
              cp -r "$SCRIPTS_DIR" scripts/

              # Install base dependencies (transformers/trl/peft versions managed by run_pipeline.sh)
              uv pip install datasets rouge-score tenacity accelerate bitsandbytes

              # Run full pipeline
              export DATA_DIR
              bash scripts/run_pipeline.sh \
                meta-llama/Llama-2-7b-chat-hf \
                "$RESULTS_DIR"
          resources:
            requests:
              cpu: 1
            limits:
              memory: "128G"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: project-storage
              mountPath: /tamperbench_data
            - name: devshm
              mountPath: /dev/shm
          env:
            - name: GIT_ASKPASS
              value: "true"
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: pat
            - name: GIT_CONFIG_PARAMETERS
              value: "'credential.https://github.com.username=$(GITHUB_PAT)'"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface
                  key: token
            - name: WANDB_MODE
              value: "offline"
      imagePullSecrets:
        - name: docker
      restartPolicy: Never
